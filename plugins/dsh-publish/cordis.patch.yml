# 组合包自带 overlay：dsh plugin add 装上本包时会自动加载这一层完成接线，
# 不需要再手动往 profile 里写 insert 条目。
#
# 这里只放与机器无关的配置。机器专属项（sauBin / sauCwd / xhsBaseUrl 等）
# 请覆盖在 ~/.dsh/profiles/<profile>/cordis.patch.yml —— 那一层在所有组合包
# 之后应用，同名 config 字段以它为准。
#
# 未写出的 config 字段全部走 src/defaults.ts 的上游默认值。
- insert:
    - id: publish
      name: 'dsh-plugin-publish'
      config:
        # account 名即 sau 的 --account，登录时用同一个名字
        accounts:
          - platform: xiaohongshu
            name: default
          - platform: douyin
            name: default
